rules:
  - id: "RULE_001"
    name: "INVENTORY_ZERO_ORDERS_POSITIVE"
    description: "Orders or revenue occurred while available inventory was zero."
    severity: "CRITICAL"
    confidence: 1.0
    business_explanation: "Systems indicate sales of an out-of-stock item, which suggests database discrepancy, ghost inventory, or overselling."
    recommended_action: "Audit sales logs and physical warehouse counts to resolve inventory mismatch immediately."

  - id: "RULE_002"
    name: "INVENTORY_NEGATIVE"
    description: "Available inventory fell below zero."
    severity: "HIGH"
    confidence: 1.0
    business_explanation: "Inventory is reported as negative, indicating backorders were accepted without proper system settings or stock counts are corrupted."
    recommended_action: "Verify current open backorders and sync stock levels in the ERP database."

  - id: "RULE_003"
    name: "MARKETING_DOUBLED_REVENUE_UNCHANGED"
    description: "Marketing spend doubled (or increased by over 100%) but revenue did not improve."
    severity: "MEDIUM"
    confidence: 0.85
    business_explanation: "A substantial increase in ad spend failed to drive sales growth, indicating poor campaign target alignment or broken tracking links."
    recommended_action: "Inspect campaign targeting settings and track checkout conversions for recent ads."

  - id: "RULE_004"
    name: "DISCOUNT_INCREASED_ORDERS_DECREASED"
    description: "Average discount increased but sales order volumes declined."
    severity: "HIGH"
    confidence: 0.90
    business_explanation: "Price promotions are failing to stimulate demand, suggesting potential pricing elasticity shift, checkout friction, or market demand collapse."
    recommended_action: "Investigate whether customer reviews are dropping or competitive prices were cut lower."

  - id: "RULE_005"
    name: "CTR_HIGH_CONVERSION_COLLAPSED"
    description: "Ad CTR is high, but detail page conversion rate has collapsed."
    severity: "HIGH"
    confidence: 0.88
    business_explanation: "Ads are highly appealing (high clicks), but customers leave immediately when reaching the product details page, suggesting bad landing pages or price discrepancy."
    recommended_action: "Check landing page load speed, out-of-stock messages, or price inconsistencies in the ad creative."

  - id: "RULE_006"
    name: "TRAFFIC_NORMAL_ORDERS_COLLAPSED"
    description: "Traffic is stable or normal, but orders have collapsed."
    severity: "CRITICAL"
    confidence: 0.95
    business_explanation: "User traffic is normal but no checkout orders are being completed, indicating a severe broken payment gateway or cart failure."
    recommended_action: "Run end-to-end payment and checkout transaction tests immediately to check server errors."

  - id: "RULE_007"
    name: "PROFIT_NEGATIVE_REVENUE_INCREASING"
    description: "Product profit margin is negative while revenue is growing."
    severity: "HIGH"
    confidence: 0.92
    business_explanation: "Product sales are increasing, but are unprofitable due to high shipping fees, deep discounts, or rising acquisition costs."
    recommended_action: "Review discount strategy or shipping subsidy thresholds for this product to prevent margin bleeding."

  - id: "RULE_008"
    name: "SHIPPING_INCREASED_CONVERSION_DECREASED"
    description: "Shipping fee increased significantly and conversion rate decreased."
    severity: "MEDIUM"
    confidence: 0.85
    business_explanation: "Higher shipping fees are causing high checkout cart abandonment rates."
    recommended_action: "Test free shipping thresholds or lower shipping rates to recover lost conversions."
