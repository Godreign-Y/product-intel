# ==============================================================================
# Decision Intelligence Engine Configuration
# ==============================================================================
# Centralizes all tunable parameters for the decision intelligence pipeline.
# Edit values here to adjust engine behavior without touching Python code.
# ==============================================================================

# --- Context Engine ---
context:
  # Number of recent daily snapshots to average for stable KPI baselines
  rolling_window_days: 30
  # Threshold (as fraction) for classifying a trend as "increasing" or "decreasing"
  trend_threshold_pct: 0.05

# --- Evidence Retriever ---
evidence:
  # Maximum number of historical experiments to retrieve per hypothesis
  search_limit: 5
  # Bonus added to semantic_similarity when evidence KPI matches hypothesis KPI
  kpi_match_bonus: 0.10

# --- Validation Engine ---
validation:
  # Default forecast simulation horizon (days)
  forecast_horizon_days: 14
  # Fallback change_pct if IQR computation fails (±%)
  change_pct_default: 10.0
  # Bounds for IQR-computed change_pct (±%)
  change_pct_min: 5.0
  change_pct_max: 25.0
  # Below this |delta_pct| the forecast signal is inconclusive, not contradicting
  negligible_effect_pct: 2.0
  # Minimum rows required for causal analysis
  causal_min_rows: 20
  causal_p_inconclusive: 0.10
  correlation_min_rows: 10
  max_lag_days: 7
  shap_top_n_features: 8

  # Per-signal weights for adjudication (must sum to 1.0)
  signal_weights:
    forecast: 0.35
    sensitivity: 0.25
    historical: 0.15
    causal: 0.10
    correlation: 0.10
    shap: 0.05

  adjudication:
    support_threshold: 0.60
    contradict_threshold: 0.40
    min_agreeing_families: 2
    min_contradicting_families: 2
    verdict_rank_multipliers:
      supported: 1.0
      inconclusive: 0.85
      contradicted: 0.50

  # Max |delta_pct| per driver/KPI before flagging implausible forecasts
  plausibility_bounds:
    discount_pct:
      orders: { max_positive: 50, max_negative: 30 }
      revenue: { max_positive: 40, max_negative: 25 }
      profit: { max_positive: 20, max_negative: 40 }
    avg_selling_price:
      orders: { max_positive: 25, max_negative: 40 }
      revenue: { max_positive: 35, max_negative: 30 }
      profit: { max_positive: 30, max_negative: 25 }
    marketing_spend:
      revenue: { max_positive: 45, max_negative: 30 }
      profit: { max_positive: 25, max_negative: 35 }
      orders: { max_positive: 40, max_negative: 25 }
    shipping_fee:
      conversion_rate: { max_positive: 15, max_negative: 40 }
      orders: { max_positive: 15, max_negative: 45 }
    inventory_available:
      orders: { max_positive: 50, max_negative: 35 }
      revenue: { max_positive: 45, max_negative: 30 }

  # Expected cross-KPI relationships when driver moves positively
  cross_kpi_expectations:
    discount_pct:
      orders: positive
      revenue: positive_or_mixed
      profit: negative_or_mixed
      conversion_rate: positive_or_mixed
    avg_selling_price:
      revenue: positive_or_mixed
      orders: negative_or_mixed
      profit: positive_or_mixed
    marketing_spend:
      revenue: positive
      orders: positive_or_mixed
      profit: positive_or_mixed
    shipping_fee:
      conversion_rate: negative_or_mixed
      orders: negative_or_mixed
      revenue: negative_or_mixed
    inventory_available:
      orders: positive
      revenue: positive_or_mixed

# --- Confidence Scorer ---
confidence:
  # Weighted signal contributions (must sum to 1.0)
  weights:
    historical: 0.15
    correlation: 0.20
    sensitivity: 0.20
    forecast: 0.25
    causal: 0.20

# --- Confidence Thresholds ---
confidence_thresholds:
  # Minimum confidence for "high confidence" classification
  high: 0.70
  # Minimum confidence to skip A/B test and recommend immediate rollout
  immediate_rollout: 0.75

# --- Ranking ---
ranking:
  # Rank formula weights (must sum to 1.0)
  weights:
    confidence: 0.60
    impact: 0.40

# --- Business Objectives Weights ---
business_objectives:
  profit: 0.40
  revenue: 0.25
  orders: 0.15
  retention: 0.10
  conversion: 0.10

# --- A/B Test Planner ---
ab_test:
  # Minimum detectable effect (%) — used when data-driven MDE is unavailable
  mde_pct: 5.0
  # Fallback daily traffic per product when context data is unavailable
  default_daily_traffic: 150
  # Duration bounds (days)
  min_duration_days: 14
  max_duration_days: 60
  # Statistical parameters
  alpha: 0.05
  power: 0.80

# --- Recommendation Engine ---
recommendation:
  # Action-specific rollback strategies
  rollback_strategies:
    PRICING_ADJUSTMENT: >
      Revert avg_selling_price to ±3% of pre-test baseline.
      Monitor conversion_rate daily for 72 hours post-revert.
    FULFILLMENT_OPTIMIZATION: >
      Restore shipping_fee to pre-change rate immediately
      if cart abandonment rises >5% within 48 hours.
    BUDGET_REALLOCATION: >
      Freeze marketing spend at pre-change level and redirect
      to best-performing channel if ROAS drops below 1.5x within 5 days.
    PROMOTIONAL_CAMPAIGN: >
      End the promotion and notify retained cohort if daily
      profit margin falls below baseline for 3 consecutive days.

# --- Explanation Engine ---
explanation:
  # LLM request timeout (seconds)
  llm_timeout_seconds: 30.0

# --- Elasticity Engine ---
elasticity:
  min_driver_delta:
    discount_pct: 0.5
    shipping_fee: 5.0
    avg_selling_price: 1.0
    marketing_spend: 100.0

