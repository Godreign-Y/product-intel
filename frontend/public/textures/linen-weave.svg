<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8">
  <defs>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="transparent"/>
      <!-- horizontal threads -->
      <line x1="0" y1="0.5" x2="8" y2="0.5" stroke="currentColor" stroke-width="0.45" opacity="0.55"/>
      <line x1="0" y1="2.5" x2="8" y2="2.5" stroke="currentColor" stroke-width="0.35" opacity="0.35"/>
      <line x1="0" y1="4.5" x2="8" y2="4.5" stroke="currentColor" stroke-width="0.45" opacity="0.5"/>
      <line x1="0" y1="6.5" x2="8" y2="6.5" stroke="currentColor" stroke-width="0.35" opacity="0.35"/>
      <!-- vertical threads -->
      <line x1="0.5" y1="0" x2="0.5" y2="8" stroke="currentColor" stroke-width="0.45" opacity="0.5"/>
      <line x1="2.5" y1="0" x2="2.5" y2="8" stroke="currentColor" stroke-width="0.35" opacity="0.35"/>
      <line x1="4.5" y1="0" x2="4.5" y2="8" stroke="currentColor" stroke-width="0.45" opacity="0.55"/>
      <line x1="6.5" y1="0" x2="6.5" y2="8" stroke="currentColor" stroke-width="0.35" opacity="0.35"/>
      <!-- intersection depth -->
      <circle cx="4.5" cy="4.5" r="0.35" fill="currentColor" opacity="0.12"/>
      <circle cx="0.5" cy="0.5" r="0.3" fill="currentColor" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#weave)"/>
</svg>
